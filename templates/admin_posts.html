<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Manage Posts</title>
</head>
<body>
<div class="container">
    <h1 class="mt-5">Manage Posts</h1>
    <a href="{{ url_for('create_post') }}" class="btn btn-primary mt-3">Create New Post</a>
    <table class="table mt-3">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Published At</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for post in posts %}
            <tr>
                <td>{{ post.title }}</td>
                <td>{{ post.author }}</td>
                <td>{{ post.category }}</td>
                <td>{{ post.published_at or 'N/A' }}</td>
                <td>{{ 'Published' if post.is_published else 'Draft' }}</td>
                <td>
                    <form action="{{ url_for('toggle_publish_status', id=post.id) }}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-secondary">Toggle Status</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
